# pnpm >= 10 liest diese Einstellungen hier statt aus dem "pnpm"-Feld der package.json.
allowBuilds:
  esbuild: true
  # Bildoptimierung von astro:assets — braucht seine native Binary.
  sharp: true

overrides:
  # Mehrere Peer-Ranges erlauben ^1 || 2.0.0-beta.x; ohne Override löst pnpm die Beta auf,
  # und `astro check` stürzt in deren Aufräum-Code ab (bridge.deleteEnv is not a function).
  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3
